name: Publish

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Extract version from tag
        id: version
        env:
          REF_TAG: ${{ inputs.tag }}
        run: |
          TAG="$REF_TAG"
          if [[ "$TAG" != v* ]]; then
            echo "::error::Tag '$TAG' must start with 'v'"
            exit 1
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not carry a valid SemVer version ('$VERSION')"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag     : $TAG"
          echo "Version : $VERSION"

      - name: Restore
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Same Version as build and pack: pack reads project-reference versions from the restore output.
        run: dotnet restore MyJdownloader.slnx --locked-mode "/p:Version=$VERSION"

      - name: Build (Release)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build MyJdownloader.slnx -c Release --no-restore "/p:Version=$VERSION"

      - name: Tests
        run: dotnet test MyJdownloader.slnx -c Release --no-build --filter "TestCategory!=Live"

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack MyJdownloader.slnx -c Release --no-build "/p:Version=$VERSION" -o artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  attest:
    needs: build
    # Separate job: the OIDC token used to sign the provenance never reaches a job that runs repository code.
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkgs
          path: artifacts
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  publish-github:
    # After nuget.org: if that push fails, no feed carries the version and the run can be fixed and re-run.
    # A pre-release skips nuget.org and is still pushed here.
    needs: [build, attest, publish-nugetorg]
    if: ${{ !cancelled() && needs.attest.result == 'success' && (needs.publish-nugetorg.result == 'success' || needs.publish-nugetorg.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkgs
          path: artifacts
      - name: Push to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        # GitHub Packages does not host symbol packages: push the .nupkg only.
        run: dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/$OWNER/index.json"
          --api-key "$GH_TOKEN"
          --skip-duplicate
          --no-symbols

  publish-nugetorg:
    needs: [build, attest]
    if: ${{ !contains(needs.build.outputs.version, '-') }}
    environment: nuget-org
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkgs
          path: artifacts
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_KEY"
          --skip-duplicate
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

  create-github-release:
    needs: [build, publish-github, publish-nugetorg]
    if: ${{ !cancelled() && needs.publish-github.result == 'success' && (needs.publish-nugetorg.result == 'success' || needs.publish-nugetorg.result == 'skipped') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Extract CHANGELOG section
        id: notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          COUNT=$(grep -cF "## [$VERSION]" CHANGELOG.md || true)
          if [ "$COUNT" != "1" ]; then
            echo "CHANGELOG section '## [$VERSION]' found $COUNT time(s) — falling back to generated notes"
            echo "body=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Random delimiter: a CHANGELOG line cannot close the block and inject outputs.
          DELIMITER="EOF_$(openssl rand -hex 16)"
          {
            echo "body<<$DELIMITER"
            awk -v header="## [$VERSION]" '
              index($0, header) == 1 { insec = 1; next }
              /^## \[/ { insec = 0 }
              insec && NF { print }
            ' CHANGELOG.md
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ needs.build.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: ${{ steps.notes.outputs.body == '' }}
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
