name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MyJdownloader.slnx --locked-mode

      - name: Build (Release)
        run: dotnet build MyJdownloader.slnx -c Release --no-restore

      - name: Tests
        run: dotnet test MyJdownloader.slnx -c Release --no-build --filter "TestCategory!=Live"

      # Validation only (nothing is uploaded): pack and package validation errors must show up here, not in the release run.
      - name: Pack
        run: dotnet pack MyJdownloader.slnx -c Release --no-build -o artifacts
