name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3 or 1.2.3-beta.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Build, test and pack before tagging
    # Releases start from main only: on another branch, the called publish workflow would be that branch's copy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Read-only: this job runs repository code, so it never holds the token that pushes the tag.
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Validate version (SemVer)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' — expected SemVer like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi

      - name: Record the validated commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Same commands as the publish workflow: a failure here stops the release before any tag exists.
      - name: Restore
        env:
          VERSION: ${{ inputs.version }}
        run: dotnet restore MyJdownloader.slnx --locked-mode "/p:Version=$VERSION"

      - name: Build (Release)
        env:
          VERSION: ${{ inputs.version }}
        run: dotnet build MyJdownloader.slnx -c Release --no-restore "/p:Version=$VERSION"

      - name: Tests
        run: dotnet test MyJdownloader.slnx -c Release --no-build --filter "TestCategory!=Live"

      - name: Pack
        env:
          VERSION: ${{ inputs.version }}
        run: dotnet pack MyJdownloader.slnx -c Release --no-build "/p:Version=$VERSION" -o artifacts

  create-release-tag:
    name: Create release tag
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the validate job built: main may have moved since.
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          # Kept: the job pushes the release tag with git push. It runs no repository code (grep, gh api, git tag only).
          persist-credentials: true

      # The version format was checked by the validate job.
      - name: Check tag does not exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Check CHANGELOG has a section for this version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! grep -Fq "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            echo "Rename the [Unreleased] section to [$VERSION], commit (docs(changelog): release $VERSION), then rerun this workflow."
            exit 1
          fi

      - name: Check CI is green on the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "validated commit: $SHA"
          CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI is '$CONCLUSION' on the validated commit ($SHA) — see https://github.com/${GITHUB_REPOSITORY}/actions"
            exit 1
          fi
          echo "CI on the validated commit: $CONCLUSION"

      - name: Create annotated tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Tag $TAG created."

  publish:
    name: Publish NuGet packages
    needs: create-release-tag
    uses: ./.github/workflows/publish-nuget.yml
    with:
      tag: v${{ inputs.version }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
